name: Build KernelSU-Next Kernel (cepheus)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source (crDroid 14.0)
        run: |
          set -e
          git clone --depth=1 -b 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_cepheus kernel

      - name: Integrate KernelSU Next manually (non-GKI)
        run: |
          set -e
          cd kernel
          # 不用 setup.sh：它内部 `git checkout next` 会失败并回退到不带 KSU 的分支。
          # 直接克隆源码到 drivers/kernelsu 并手工接线。
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next /tmp/ksu-src
          rm -rf drivers/kernelsu
          cp -r /tmp/ksu-src/kernel drivers/kernelsu

          # drivers/Makefile
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          # drivers/Kconfig
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '1i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # KernelSU Next 采用 late-load 模式（见 ksu.h 的 ksu_late_loaded），
          # 由驱动自身在初始化时接管，不需要修改 init/main.c。
          #   —— 早期版本注入的 ksu_init() 在这个版本里已不存在，强行注入会编译失败。

          # defconfig
          grep -q '^CONFIG_KSU=y' arch/arm64/configs/cepheus_defconfig || echo 'CONFIG_KSU=y' >> arch/arm64/configs/cepheus_defconfig

          echo "--- 集成检查 ---"
          ls drivers/kernelsu | head -5
          grep -n 'kernelsu' drivers/Makefile
          grep -n 'ksu_init' init/main.c
          grep -n 'CONFIG_KSU' arch/arm64/configs/cepheus_defconfig

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-dev flex bison bc libssl-dev \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

      - name: Show clang version
        run: ./proton-clang/bin/clang --version | head -2

      - name: Enable CONFIG_KSU in defconfig
        run: |
          cd kernel
          DEFCONFIG=arch/arm64/configs/cepheus_defconfig
          echo "--- 当前 KSU 配置 ---"
          grep -iE "CONFIG_KSU" "$DEFCONFIG" || echo "(none)"
          # KernelSU 的代码由 setup.sh 集成，但 defconfig 没开开关
          grep -q "^CONFIG_KSU=y" "$DEFCONFIG" || echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "--- 修改后 ---"
          grep -iE "CONFIG_KSU" "$DEFCONFIG"

      - name: Force dtc without YAML
        run: |
          cd kernel
          echo "--- before ---"
          sed -n '10,20p' scripts/dtc/Makefile
          # Makefile 用 pkg-config 探测 libyaml；CI 有 libyaml-dev 就编 yamltree，
          # 但编译 dtb 根本不需要 YAML 输出。把探测条件改成恒真，走 -DNO_YAML 分支。
          sed -i 's|^ifeq.*yaml-0\.1.*|ifeq (yes,yes)|' scripts/dtc/Makefile
          echo "--- after ---"
          sed -n '10,20p' scripts/dtc/Makefile

      - name: Build kernel
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export PATH="${{ github.workspace }}/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 cepheus_defconfig
          # 用 LLVM=1 让 make 自动使用 clang 的工具链，避免手写交叉前缀
          # 只构建 Image.gz-dtb：dtbo.img 的生成脚本依赖 python2（Ubuntu 22.04 已移除），
          # 而 AnyKernel3 只替换 kernel，dtbo 分区保持原样即可。
          make -j$(nproc) O=out Image.gz-dtb \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++

      - name: Collect kernel image
        run: |
          ls -lh kernel/out/arch/arm64/boot/
          cp kernel/out/arch/arm64/boot/Image.gz-dtb /tmp/Image.gz-dtb 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image.gz /tmp/Image.gz || \
          cp kernel/out/arch/arm64/boot/Image /tmp/Image
          ls -lh /tmp/Image*

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp /tmp/Image* AnyKernel3/
          cd AnyKernel3
          sed -i 's/^kernel.string=.*/kernel.string=KernelSU-Next cepheus/' anykernel.sh 2>/dev/null || true
          zip -r9 ../cepheus-ksu-next.zip . -x '.git/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-ksu-next
          path: cepheus-ksu-next.zip
          retention-days: 30
