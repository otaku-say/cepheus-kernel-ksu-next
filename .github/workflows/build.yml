name: Build KernelSU-Next Kernel (cepheus)

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: '集成 KernelSU Next（false = 纯净内核，给 Magisk 用）'
        type: boolean
        default: true
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source (crDroid 14.0)
        run: |
          set -e
          git clone --depth=1 -b 14.0 https://github.com/crdroidandroid/android_kernel_xiaomi_cepheus kernel

      - name: Integrate KernelSU Next (legacy branch, non-GKI)
        if: ${{ inputs.ksu != false }}
        run: |
          set -e
          cd kernel
          # 旧内核（4.14）必须用 legacy 分支：dev 分支的 hook 依赖 5.10+ 的
          # pt_regs 系统调用 ABI，在 4.14 上编译不过也不工作。
          # 钉到 legacy 分支上最后一个 UAPI=5 的提交 e3292239。legacy HEAD 的
          # KERNEL_SU_UAPI_VERSION 已经是 6，而 Manager v3.4.2 只认 UAPI 5，
          # 内核比管理器新会让管理器弹"管理器版本过低，请升到 6"并拒绝工作。
          KSU_COMMIT=e3292239f3b8384cc52bdc6f23995d643271a7ce
          git clone --filter=blob:none --no-checkout -b legacy \
            https://github.com/KernelSU-Next/KernelSU-Next /tmp/ksu-src
          git -C /tmp/ksu-src checkout -q "$KSU_COMMIT"
          echo "--- KSU UAPI 版本 ---"
          grep -E 'UAPI_VERSION' /tmp/ksu-src/uapi/supercall.h || true
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          cp -a /tmp/ksu-src/kernel/. drivers/kernelsu/
          # kernel/include/uapi 是指向仓库顶层 ../../uapi 的相对 symlink，
          # 复制后会悬空（drivers/uapi 不存在），必须实体化，否则
          # policy/allowlist.h 里 #include "uapi/app_profile.h" 直接失败。
          rm -f drivers/kernelsu/include/uapi
          cp -a /tmp/ksu-src/uapi drivers/kernelsu/include/uapi
          test -f drivers/kernelsu/include/uapi/app_profile.h

          # crDroid 内核源码本来就接好线了，这里只做断言，不重复改写：
          #   drivers/Makefile : obj-y += kernelsu/
          #   drivers/Kconfig  : source "drivers/kernelsu/Kconfig"
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          # crDroid 内核的 hook 点是 manual hook 模型（fs/exec.c、fs/read_write.c、
          # fs/stat.c、fs/open.c、drivers/input/input.c 里都有 #ifdef CONFIG_KSU 的
          # 调用点），所以必须走 manual hook；用 kprobes 会让这些调用点找不到符号，
          # 而且 ksud 的 init 注入也不会发生（su 无法进入 PATH）。
          DEFCONFIG=arch/arm64/configs/cepheus_defconfig
          for opt in CONFIG_KSU=y CONFIG_KSU_MANUAL_HOOK=y; do
            grep -qx "$opt" "$DEFCONFIG" || echo "$opt" >> "$DEFCONFIG"
          done

          # KSU 用 kernel/reboot.c 里有没有 ksu_handle_sys_reboot 判断 manual hook
          # 是否已集成（HAVE_KSU_HOOK），没有就直接 $(error) 中断构建。补上它。
          if ! grep -q 'ksu_handle_sys_reboot' kernel/reboot.c; then
            python3 -c "import pathlib;p=pathlib.Path('kernel/reboot.c');s=p.read_text();s=s.replace('#include <linux/uaccess.h>','#include <linux/uaccess.h>\\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);',1);s=s.replace('\\tchar buffer[256];\\n\\tint ret = 0;','\\tchar buffer[256];\\n\\tint ret = 0;\\n\\n\\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);',1);p.write_text(s)"
          fi
          echo '--- reboot.c hook count ---'
          grep -c 'ksu_handle_sys_reboot' kernel/reboot.c

          # KSU 的 Kbuild 会往 fs/namespace.c 注入 path_umount()/can_umount()，
          # 但 kbuild 解析 drivers/* 时 fs/ 早就编译完了：源文件被改、
          # KSU_HAS_PATH_UMOUNT 被定义，而 .o 里根本没有该函数。4.14 本来就走
          # kernel_umount.c 的 #else 分支（ksu_sys_umount），直接关掉注入。
          KBUILD=drivers/kernelsu/Kbuild
          sed -i 's|^\$(shell sed -i .*/\^static bool is_mnt_ns_file/i .*|# &|' "$KBUILD"
          sed -i 's|^ccflags-y += -DKSU_HAS_PATH_UMOUNT|# &|' "$KBUILD"

      - name: Ensure KSU is disabled (pure kernel build)
        if: ${{ inputs.ksu == false }}
        run: |
          cd kernel
          DEFCONFIG=arch/arm64/configs/cepheus_defconfig
          # 原厂 defconfig 自带 CONFIG_KSU=y 吗？有就注释掉，保证内核里没有 KSU
          sed -i 's|^CONFIG_KSU=y|# CONFIG_KSU is not set|' "$DEFCONFIG"
          grep -n 'CONFIG_KSU' "$DEFCONFIG" || true

          # drivers/kernelsu 在 crDroid 源码里是未初始化的 submodule（空目录），
          # 纯内核模式不再 clone KSU 源码，所以必须把这两个引用摘掉，
          # 否则 kconfig 直接报 can't open file "drivers/kernelsu/Kconfig"。
          sed -i 's|^source "drivers/kernelsu/Kconfig"|# &|' drivers/Kconfig
          sed -i 's|^obj-y += kernelsu/$|# &|' drivers/Makefile
          echo '--- 摘除 kernelsu 引用 ---'
          grep -n 'kernelsu' drivers/Kconfig drivers/Makefile || echo '(none)'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libyaml-dev flex bison bc libssl-dev \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Setup clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

      - name: Show clang version
        run: ./proton-clang/bin/clang --version | head -2

      - name: Force dtc without YAML
        run: |
          cd kernel
          echo "--- before ---"
          sed -n '10,20p' scripts/dtc/Makefile
          # Makefile 用 pkg-config 探测 libyaml；CI 有 libyaml-dev 就编 yamltree，
          # 但编译 dtb 根本不需要 YAML 输出。把探测条件改成恒真，走 -DNO_YAML 分支。
          sed -i 's|^ifeq.*yaml-0\.1.*|ifeq (yes,yes)|' scripts/dtc/Makefile
          echo "--- after ---"
          sed -n '10,20p' scripts/dtc/Makefile

      - name: Build kernel
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export PATH="${{ github.workspace }}/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 cepheus_defconfig
          # 快速失败：Kconfig 没生效时立刻退出，不浪费十几分钟编译
          if [ "${{ inputs.ksu }}" != "false" ]; then
            grep -qx 'CONFIG_KSU=y' out/.config || {
              echo 'FATAL: CONFIG_KSU 没有进入 .config'; grep -i ksu out/.config; exit 1; }
          else
            grep -qx 'CONFIG_KSU=y' out/.config && {
              echo 'FATAL: 纯内核模式仍启用了 CONFIG_KSU'; exit 1; } || true
            echo 'pure kernel: CONFIG_KSU 已禁用'
          fi
          grep -qx 'CONFIG_KPROBES=y' out/.config || echo 'WARN: KPROBES 未开启，KSU 将退化为 manual hook'
          # 用 LLVM=1 让 make 自动使用 clang 的工具链，避免手写交叉前缀
          # 只构建 Image.gz-dtb：dtbo.img 的生成脚本依赖 python2（Ubuntu 22.04 已移除），
          # 而 AnyKernel3 只替换 kernel，dtbo 分区保持原样即可。
          make -j$(nproc) O=out Image.gz-dtb \
            ARCH=arm64 \
            KSU_VERSION_OVERRIDE=33355 \
            KSU_VERSION_TAG_OVERRIDE=v3.4.2 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++

      - name: Verify KSU hooks are actually compiled in
        if: ${{ inputs.ksu != false }}
        run: |
          set -e
          cd kernel
          echo "=== 调用点是否引用了 KSU 符号（每条都应有输出）==="
          for f in fs/exec.o fs/open.o fs/stat.o fs/read_write.o drivers/input/input.o kernel/reboot.o; do
            printf '%-28s ' "$f"
            if [ -f "out/$f" ]; then
              n=$(nm "out/$f" 2>/dev/null | grep -c ' U ksu_' || true)
              echo "undef ksu_ syms = $n"
            else
              echo "MISSING OBJECT"
            fi
          done
          echo
          echo "=== KSU 侧是否定义了这些符号 ==="
          for s in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_vfs_read ksu_handle_sys_reboot ksu_handle_input_handle_event ksu_handle_newfstat_ret; do
            printf '%-34s ' "$s"
            nm out/drivers/kernelsu/built-in.o 2>/dev/null | grep -E " (T|t) $s\$" | head -1 || echo "NOT DEFINED"
          done
          echo
          echo "=== .config 里的 KSU 相关开关 ==="
          grep -E '^CONFIG_(KSU|KSU_|KPROBES|KRETPROBES)' out/.config || true

      - name: Collect kernel image
        run: |
          ls -lh kernel/out/arch/arm64/boot/
          cp kernel/out/arch/arm64/boot/Image.gz-dtb /tmp/Image.gz-dtb 2>/dev/null || \
          cp kernel/out/arch/arm64/boot/Image.gz /tmp/Image.gz || \
          cp kernel/out/arch/arm64/boot/Image /tmp/Image
          ls -lh /tmp/Image*

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp /tmp/Image* AnyKernel3/
          cd AnyKernel3
          sed -i 's/^kernel.string=.*/kernel.string=KernelSU-Next cepheus/' anykernel.sh 2>/dev/null || true
          zip -r9 ../cepheus-ksu-next.zip . -x '.git/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-ksu-next
          path: cepheus-ksu-next.zip
          retention-days: 30
